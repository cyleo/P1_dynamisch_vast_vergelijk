<text x="347.24" y="170.58333333333334" text-anchor="middle" font-size="12" fill="#555">de EB-vloer: ≈ €0,135 (belasting + opslag)</text>
<g font-size="12" font-weight="600">
<text x="661.52" y="74" text-anchor="middle" fill="#1a7f4e">spot &gt; €0,02</text>
<text x="661.52" y="92" text-anchor="middle" font-weight="400" fill="#1a7f4e">exporteren levert op:</text>
<text x="661.52" y="108" text-anchor="middle" font-weight="400" fill="#1a7f4e">laat alles draaien</text>
<text x="366.64" y="74" text-anchor="middle" fill="#b07c1f">€0,02 … −€0,135</text>
<text x="366.64" y="92" text-anchor="middle" font-weight="400" fill="#b07c1f">exporteren kost geld → DIM</text>
<text x="366.64" y="108" text-anchor="middle" font-weight="400" fill="#b07c1f">naar 0 export; eigen zon</text>
<text x="366.64" y="124" text-anchor="middle" font-weight="400" fill="#b07c1f">verbruiken blijft gratis</text>
<text x="153.24" y="74" text-anchor="middle" fill="#b03a30">spot &lt; −€0,135</text>
<text x="153.24" y="92" text-anchor="middle" font-weight="400" fill="#b03a30">importeren levert geld op:</text>
<text x="153.24" y="108" text-anchor="middle" font-weight="400" fill="#b03a30">panelen uit + accu/EV/WP</text>
<text x="153.24" y="124" text-anchor="middle" font-weight="400" fill="#b03a30">vol van het net laden</text>
</g>
