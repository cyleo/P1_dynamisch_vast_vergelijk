name: CI Build and Test

on:
  push:
    branches:
      - main
      - gitea
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: ./build.sh

      - name: Run Tests
        run: npm run test
